# Local development stack (Mac). Project name isolates this from staging containers.
name: npa-ecm-local

services:
  postgres:
    image: postgres:16-alpine
    container_name: ecm-postgres-local
    environment:
      POSTGRES_DB: npa_ecm_local
      POSTGRES_USER: ecmadmin
      POSTGRES_PASSWORD: ecmadmin
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecmadmin -d npa_ecm_local"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ecm-redis-local
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ecm-backend-local
    env_file:
      - ./backend/env/local.env
    environment:
      DB_NAME: npa_ecm_local
      DB_USER: ecmadmin
      DB_PASSWORD: ecmadmin
      DB_HOST: postgres
      DB_PORT: 5432
      THROTTLE_USER_RATE: "1000/minute"
    volumes:
      - ./backend:/app
      - media-data:/app/media
      - static-data:/app/staticfiles
    command: >
      sh -c "python manage.py migrate &&
             python manage.py ensure_dev_login_users &&
             daphne -b 0.0.0.0 -p 8002 ecm_backend.asgi:application"
    ports:
      - "8002:8002"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ecm-celery-worker-local
    env_file:
      - ./backend/env/local.env
    environment:
      DB_NAME: npa_ecm_local
      DB_USER: ecmadmin
      DB_PASSWORD: ecmadmin
      DB_HOST: postgres
      DB_PORT: 5432
      THROTTLE_USER_RATE: "1000/minute"
    command: celery -A ecm_backend worker -l info
    volumes:
      - ./backend:/app
      - media-data:/app/media
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ecm-celery-beat-local
    env_file:
      - ./backend/env/local.env
    environment:
      # Explicitly set DB credentials to ensure they're used
      DB_NAME: npa_ecm_local
      DB_USER: ecmadmin
      DB_PASSWORD: ecmadmin
      DB_HOST: postgres
      DB_PORT: 5432
    command: celery -A ecm_backend beat -l info
    volumes:
      - ./backend:/app
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile.local
    container_name: ecm-frontend-local
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8002/api/v1
      INTERNAL_API_URL: http://backend:8002/api/v1
      NODE_ENV: development
    volumes:
      - ./frontend:/app/frontend
      - /app/node_modules
      - /app/frontend/node_modules
      # Isolated from host .next; if dev 500s / ENOENT build-manifest, remove volume next-dev-cache
      - next-dev-cache:/app/frontend/.next
    ports:
      - "3002:3002"
    depends_on:
      backend:
        condition: service_started

volumes:
  postgres-data:
  media-data:
  static-data:
  next-dev-cache:







