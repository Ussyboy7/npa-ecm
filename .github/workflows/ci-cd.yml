name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      deploy_production:
        description: "Deploy to production after CI (requires self-hosted runner + approval)"
        required: false
        default: false
        type: boolean

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"
  NEXT_PUBLIC_API_URL: http://localhost:8002/api/v1

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: npa_ecm_ci
          POSTGRES_USER: ecmadmin
          POSTGRES_PASSWORD: ecmadmin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ecmadmin -d npa_ecm_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: npa_ecm_ci
      DB_USER: ecmadmin
      DB_PASSWORD: ecmadmin
      TEST_DB_NAME: test_npa_ecm_db
      DJANGO_SETTINGS_MODULE: ecm_backend.settings_test
      DJANGO_SECRET_KEY: ci-test-secret-key-not-for-production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Check for missing migrations
        working-directory: backend
        run: python manage.py makemigrations --check --dry-run

      - name: Run Django tests
        run: bash scripts/ci/run-backend-tests.sh

  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Vitest
        run: cd frontend && npm test

      - name: TypeScript
        run: cd frontend && npm run type-check

      - name: ESLint
        run: cd frontend && npm run lint

      - name: Production build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: ${{ env.NEXT_PUBLIC_API_URL }}
        run: npm run build

  security-scan:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install scan tools
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt
          npm ci

      - name: Bandit (Python — high severity)
        run: >-
          python -m bandit -r
          backend/accounts backend/analytics backend/audit backend/capture
          backend/common backend/correspondence backend/dms backend/ecm_backend
          backend/forms backend/integrations backend/notifications
          backend/organization backend/search backend/support backend/workflow
          -lll -q

      - name: pip-audit (Python dependencies)
        run: python -m pip_audit -r backend/requirements.txt

      - name: npm audit (critical only)
        working-directory: frontend
        run: npm audit --audit-level=critical

  docker-validate:
    name: Docker validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose files
        run: bash scripts/ci/validate-compose.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image (no push)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile.prod
          push: false
          load: true
          tags: npa-ecm-backend:ci
          cache-from: type=gha,scope=npa-ecm-backend
          cache-to: type=gha,mode=max,scope=npa-ecm-backend

      - name: Build frontend image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./frontend/Dockerfile.prod
          push: false
          load: true
          tags: npa-ecm-frontend:ci
          cache-from: type=gha,scope=npa-ecm-frontend
          cache-to: type=gha,mode=max,scope=npa-ecm-frontend

  deploy-staging:
    name: Deploy staging
    needs: [backend, frontend, security-scan, docker-validate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted
    environment: staging
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to staging
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}"
          chmod +x scripts/staging/env-manager.sh scripts/ops/env-manager.sh scripts/lib/*.sh scripts/stack/*.sh scripts/backup/*.sh
          DEPLOY_PATH=/srv/npa-ecm SERVER_IP=172.16.0.46 ./scripts/staging/env-manager.sh deploy

      - name: Smoke test staging
        run: |
          set -euo pipefail
          curl -fsS --retry 5 --retry-delay 5 http://localhost:4646/
          curl -fsS --retry 5 --retry-delay 5 http://localhost:4646/api/v1/health/live/

      - name: Notify deployment success
        if: success() && env.SLACK_WEBHOOK_URL != ''
        uses: 8398a7/action-slack@v3
        with:
          status: success
          text: "NPA ECM staging deployment successful"
          channel: "#deployments"
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Notify deployment failure
        if: failure() && env.SLACK_WEBHOOK_URL != ''
        uses: 8398a7/action-slack@v3
        with:
          status: failure
          text: "NPA ECM staging deployment failed"
          channel: "#deployments"
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  deploy-production:
    name: Deploy production
    needs: [backend, frontend, security-scan, docker-validate]
    if: |
      github.event_name == 'workflow_dispatch' &&
      inputs.deploy_production == true
    runs-on: self-hosted
    environment: production
    concurrency: production-deployment
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to production
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}"
          chmod +x scripts/production/env-manager.sh scripts/ops/env-manager.sh scripts/lib/*.sh scripts/stack/*.sh scripts/backup/*.sh
          DEPLOY_PATH="${DEPLOY_PATH:-/srv/npa-ecm-prod}" ./scripts/production/env-manager.sh deploy

      - name: Smoke test production
        run: |
          set -euo pipefail
          curl -fsS --retry 5 --retry-delay 5 "${PROD_HEALTH_URL:-http://localhost/api/v1/health/live/}"

      - name: Notify production deployment
        if: env.SLACK_WEBHOOK_URL != ''
        uses: 8398a7/action-slack@v3
        with:
          status: success
          text: "NPA ECM production deployment completed"
          channel: "#production-deployments"
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
