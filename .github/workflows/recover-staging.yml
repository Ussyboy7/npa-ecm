name: Recover staging database

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type RESTORE to confirm the destructive restore
        required: true
        type: string

permissions:
  contents: read

jobs:
  restore:
    runs-on: self-hosted
    timeout-minutes: 40
    if: ${{ inputs.confirm == 'RESTORE' }}
    steps:
      - name: Restore pre-incident snapshot and redeploy
        run: |
          set -euo pipefail
          cd /srv/npa-ecm
          echo "Checkout: $(git rev-parse --short HEAD)"
          if ! docker ps --format '{{.Names}}' | grep -qx ecm-postgres-stag; then
            docker start ecm-postgres-stag
            sleep 10
          fi
          snapshot=$(find backups -maxdepth 1 -name 'predeploy_staging_*.sql' \
            ! -newermt '2026-11-22 13:31:00' -printf '%T@ %p\n' \
            | sort -n | tail -1 | cut -d' ' -f2-)
          test -n "${snapshot}" || { echo "No pre-incident snapshot found"; exit 1; }
          echo "Restoring: ${snapshot}"
          docker exec ecm-postgres-stag pg_dump -U ecmadmin npa_ecm_stag \
            > "backups/prerestore_staging_$(date -u +%Y%m%dT%H%M%SZ).sql" || true
          docker exec ecm-postgres-stag psql -U ecmadmin -d postgres -v ON_ERROR_STOP=1 \
            -c "SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE datname='npa_ecm_stag' AND pid <> pg_backend_pid();" \
            -c "DROP DATABASE IF EXISTS npa_ecm_stag;" \
            -c "CREATE DATABASE npa_ecm_stag OWNER ecmadmin;"
          docker exec -i ecm-postgres-stag psql -U ecmadmin -d npa_ecm_stag -v ON_ERROR_STOP=1 < "${snapshot}"
          DEPLOY_PATH=/srv/npa-ecm SERVER_IP=172.16.0.46 ./scripts/staging/env-manager.sh deploy --no-pull
