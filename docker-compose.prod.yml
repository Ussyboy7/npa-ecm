services:
  postgres:
    image: postgres:16-alpine
    container_name: ecm-postgres-prod
    environment:
      POSTGRES_DB: ${DB_NAME:-npa_ecm_prod}
      POSTGRES_USER: ${DB_USER:-npa_ecm_prod}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change_me}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-npa_ecm_prod} -d ${DB_NAME:-npa_ecm_prod}"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: always

  redis:
    image: redis:7-alpine
    container_name: ecm-redis-prod
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 5
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: ecm-backend-prod
    env_file:
      - ./backend/env/prod.env
    volumes:
      - media-data:/app/media
      - static-data:/app/staticfiles
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live/', timeout=2).read()\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    restart: always

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: ecm-celery-worker-prod
    env_file:
      - ./backend/env/prod.env
    command: celery -A ecm_backend worker -l info
    volumes:
      - media-data:/app/media
      - static-data:/app/staticfiles
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: always

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: ecm-celery-beat-prod
    env_file:
      - ./backend/env/prod.env
    command: celery -A ecm_backend beat -l info
    volumes:
      - media-data:/app/media
      - static-data:/app/staticfiles
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: always

  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile.prod
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://ecm.nigerianports.gov.ng/api}
        NEXT_PUBLIC_ENVIRONMENT: production
    container_name: ecm-frontend-prod
    environment:
      # NOTE: NEXT_PUBLIC_* is baked at build time; keep this for transparency/logging only
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://ecm.nigerianports.gov.ng/api}
      NODE_ENV: production
    expose:
      - "3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: always

  nginx:
    image: nginx:alpine
    container_name: ecm-nginx-prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - static-data:/var/www/static
      - media-data:/var/www/media
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
    restart: always

volumes:
  postgres-data:
  redis-data:
  media-data:
  static-data:







