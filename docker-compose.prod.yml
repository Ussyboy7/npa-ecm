# Production stack — scaled for high concurrent ECMS load.
# Scale at deploy via BACKEND_REPLICAS / CELERY_REPLICAS / FRONTEND_REPLICAS
# (see scripts/ops/env-manager.sh). Do not set container_name on scaled services.
name: npa-ecm-prod

x-backend-image: &backend-image
  build:
    context: ./backend
    dockerfile: Dockerfile.prod
  env_file:
    - ./backend/env/prod.env
  volumes:
    - media-data:/app/media
    - static-data:/app/staticfiles

services:
  postgres:
    image: postgres:16-alpine
    container_name: ecm-postgres-prod
    environment:
      POSTGRES_DB: ${DB_NAME:-npa_ecm_prod}
      POSTGRES_USER: ${DB_USER:-npa_ecm_prod}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change_me}
    command:
      - postgres
      - -c
      - max_connections=300
      - -c
      - shared_buffers=1GB
      - -c
      - effective_cache_size=3GB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - wal_buffers=16MB
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-npa_ecm_prod} -d ${DB_NAME:-npa_ecm_prod}"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: always

  pgbouncer:
    image: edoburu/pgbouncer:v1.23.1-p1
    container_name: ecm-pgbouncer-prod
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-npa_ecm_prod}
      DB_PASSWORD: ${DB_PASSWORD:-change_me}
      DB_NAME: ${DB_NAME:-npa_ecm_prod}
      POOL_MODE: session
      MAX_CLIENT_CONN: "5000"
      DEFAULT_POOL_SIZE: "80"
      MIN_POOL_SIZE: "20"
      RESERVE_POOL_SIZE: "20"
      LISTEN_PORT: "5432"
      AUTH_TYPE: scram-sha-256
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "printf 'QUIT\\n' | nc -w 1 127.0.0.1 5432 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: always

  redis:
    image: redis:7-alpine
    container_name: ecm-redis-prod
    command: redis-server --appendonly yes --maxclients 20000
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 5
    restart: always

  migrate:
    <<: *backend-image
    container_name: ecm-migrate-prod
    environment:
      DB_HOST: pgbouncer
      DB_PORT: "5432"
    entrypoint: ["/app/scripts/docker-migrate.sh"]
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"

  backend:
    <<: *backend-image
    environment:
      SKIP_ENTRYPOINT_SETUP: "true"
      DB_HOST: pgbouncer
      DB_PORT: "5432"
      DB_CONN_MAX_AGE: "60"
    expose:
      - "8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live/', timeout=2).read()\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    restart: always

  celery-worker:
    <<: *backend-image
    environment:
      SKIP_ENTRYPOINT_SETUP: "true"
      # Celery/beat use direct Postgres to avoid pooler edge cases on long tasks
      DB_HOST: postgres
      DB_PORT: "5432"
    command: celery -A ecm_backend worker -l info --concurrency=${CELERY_CONCURRENCY:-4}
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always

  celery-beat:
    <<: *backend-image
    container_name: ecm-celery-beat-prod
    environment:
      SKIP_ENTRYPOINT_SETUP: "true"
      DB_HOST: postgres
      DB_PORT: "5432"
    command: celery -A ecm_backend beat -l info
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always

  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile.prod
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://ecm.nigerianports.gov.ng/api}
        NEXT_PUBLIC_ENVIRONMENT: production
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://ecm.nigerianports.gov.ng/api}
      NODE_ENV: production
    expose:
      - "3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: always

  nginx:
    image: nginx:alpine
    container_name: ecm-nginx-prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - static-data:/var/www/static
      - media-data:/var/www/media
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
    restart: always

volumes:
  postgres-data:
  redis-data:
  media-data:
  static-data:
