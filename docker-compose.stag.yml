# Staging stack — intended for the staging SERVER (172.16.0.46), not day-to-day Mac dev.
# On Mac: use docker-compose.local.yml (or `docker compose up` via compose.yaml).
# To run staging locally for a one-off test: ECM_ALLOW_LOCAL_STAG=1 scripts/staging/env-manager.sh start
name: npa-ecm-stag

networks:
  ecm_stag_network:
    driver: bridge

services:
  postgres:
    image: postgres:16-alpine
    container_name: ecm-postgres-stag
    environment:
      POSTGRES_DB: npa_ecm_stag
      POSTGRES_USER: ecmadmin
      POSTGRES_PASSWORD: ecmadmin
    volumes:
      - postgres_stag_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecmadmin -d npa_ecm_stag"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - ecm_stag_network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: ecm-redis-stag
    command: redis-server --appendonly yes
    volumes:
      - redis_stag_data:/data
    networks:
      - ecm_stag_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: ecm-backend-stag
    env_file:
      - ./backend/env/stag.env
    volumes:
      - ./backend/media:/app/media
      - ./backend/staticfiles:/app/staticfiles
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live/', timeout=2).read()\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    networks:
      - ecm_stag_network
    restart: unless-stopped

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: ecm-celery-worker-stag
    env_file:
      - ./backend/env/stag.env
    command: celery -A ecm_backend worker -l info
    volumes:
      - ./backend:/app
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - ecm_stag_network
    restart: unless-stopped

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: ecm-celery-beat-stag
    env_file:
      - ./backend/env/stag.env
    command: celery -A ecm_backend beat -l info
    volumes:
      - ./backend:/app
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - ecm_stag_network
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile.stag
      args:
        NEXT_PUBLIC_API_URL: http://172.16.0.46:4646/api
        NEXT_PUBLIC_ENVIRONMENT: staging
    container_name: ecm-frontend-stag
    environment:
      NEXT_PUBLIC_API_URL: http://172.16.0.46:4646/api
      NEXT_PUBLIC_ENVIRONMENT: staging
    depends_on:
      backend:
        condition: service_started
    networks:
      - ecm_stag_network
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: ecm-nginx-stag
    ports:
      - "4646:80"
    volumes:
      - ./nginx/stag.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/ssl:/etc/nginx/ssl
      - ./backend/media:/app/media:ro
      - ./backend/staticfiles:/app/staticfiles:ro
      - nginx_stag_logs:/var/log/nginx
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_started
    networks:
      - ecm_stag_network
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: ecm-prometheus-stag
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_stag_data:/prometheus
    networks:
      - ecm_stag_network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: ecm-grafana-stag
    environment:
      GF_SECURITY_ADMIN_PASSWORD: staging_admin_change_me
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_stag_data:/var/lib/grafana
    networks:
      - ecm_stag_network
    restart: unless-stopped

volumes:
  postgres_stag_data:
  redis_stag_data:
  nginx_stag_logs:
  prometheus_stag_data:
  grafana_stag_data:
