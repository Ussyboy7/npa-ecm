# Staging stack — intended for the staging SERVER (172.16.0.46), not day-to-day Mac dev.
# On Mac: use docker-compose.local.yml (or `docker compose up` via compose.yaml).
# To run staging locally for a one-off test: ECM_ALLOW_LOCAL_STAG=1 scripts/staging/env-manager.sh start
#
# Scaled like prod (smaller defaults). Scale via BACKEND_REPLICAS / CELERY_REPLICAS / FRONTEND_REPLICAS.
name: npa-ecm-stag

networks:
  ecm_stag_network:
    driver: bridge

x-backend-image: &backend-image
  build:
    context: ./backend
    dockerfile: Dockerfile.prod
  env_file:
    - ./backend/env/stag.env
  volumes:
    - ./backend/media:/app/media
    - ./backend/staticfiles:/app/staticfiles
  networks:
    - ecm_stag_network

services:
  postgres:
    image: postgres:16-alpine
    container_name: ecm-postgres-stag
    environment:
      POSTGRES_DB: ${DB_NAME:-npa_ecm_stag}
      POSTGRES_USER: ${DB_USER:-ecmadmin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ecmadmin}
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=256MB
    volumes:
      - postgres_stag_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-ecmadmin} -d ${DB_NAME:-npa_ecm_stag}"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - ecm_stag_network
    restart: unless-stopped

  pgbouncer:
    image: edoburu/pgbouncer:v1.23.1-p1
    container_name: ecm-pgbouncer-stag
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-ecmadmin}
      DB_PASSWORD: ${DB_PASSWORD:-ecmadmin}
      DB_NAME: ${DB_NAME:-npa_ecm_stag}
      POOL_MODE: session
      MAX_CLIENT_CONN: "2000"
      DEFAULT_POOL_SIZE: "40"
      MIN_POOL_SIZE: "10"
      RESERVE_POOL_SIZE: "10"
      LISTEN_PORT: "5432"
      AUTH_TYPE: scram-sha-256
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "printf 'QUIT\\n' | nc -w 1 127.0.0.1 5432 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - ecm_stag_network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: ecm-redis-stag
    command: redis-server --appendonly yes --maxclients 10000
    volumes:
      - redis_stag_data:/data
    networks:
      - ecm_stag_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 5

  migrate:
    <<: *backend-image
    container_name: ecm-migrate-stag
    environment:
      DB_HOST: pgbouncer
      DB_PORT: "5432"
    entrypoint: ["/app/scripts/docker-migrate.sh"]
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"

  backend:
    <<: *backend-image
    environment:
      SKIP_ENTRYPOINT_SETUP: "true"
      DB_HOST: pgbouncer
      DB_PORT: "5432"
      DB_CONN_MAX_AGE: "60"
    expose:
      - "8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live/', timeout=2).read()\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    restart: unless-stopped

  celery-worker:
    <<: *backend-image
    environment:
      SKIP_ENTRYPOINT_SETUP: "true"
      DB_HOST: postgres
      DB_PORT: "5432"
    command: celery -A ecm_backend worker -l info --concurrency=${CELERY_CONCURRENCY:-2}
    volumes:
      - ./backend:/app
      - ./backend/media:/app/media
      - ./backend/staticfiles:/app/staticfiles
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  celery-beat:
    <<: *backend-image
    container_name: ecm-celery-beat-stag
    environment:
      SKIP_ENTRYPOINT_SETUP: "true"
      DB_HOST: postgres
      DB_PORT: "5432"
    command: celery -A ecm_backend beat -l info
    volumes:
      - ./backend:/app
      - ./backend/media:/app/media
      - ./backend/staticfiles:/app/staticfiles
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile.stag
      args:
        NEXT_PUBLIC_API_URL: http://172.16.0.46:4646/api
        NEXT_PUBLIC_ENVIRONMENT: staging
    environment:
      NEXT_PUBLIC_API_URL: http://172.16.0.46:4646/api
      NEXT_PUBLIC_ENVIRONMENT: staging
    expose:
      - "3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - ecm_stag_network
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: ecm-nginx-stag
    ports:
      - "4646:80"
    volumes:
      - ./nginx/stag.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/ssl:/etc/nginx/ssl
      - ./backend/media:/app/media:ro
      - ./backend/staticfiles:/app/staticfiles:ro
      - nginx_stag_logs:/var/log/nginx
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
    networks:
      - ecm_stag_network
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: ecm-prometheus-stag
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_stag_data:/prometheus
    networks:
      - ecm_stag_network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: ecm-grafana-stag
    environment:
      GF_SECURITY_ADMIN_PASSWORD: staging_admin_change_me
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_stag_data:/var/lib/grafana
    networks:
      - ecm_stag_network
    restart: unless-stopped

volumes:
  postgres_stag_data:
  redis_stag_data:
  nginx_stag_logs:
  prometheus_stag_data:
  grafana_stag_data:
