<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Circular text path for top text -->
    <path id="topTextPath" d="M 200,200 m -150,0 a 150,150 0 0,1 300,0" fill="none"/>
    <!-- Circular text path for bottom text -->
    <path id="bottomTextPath" d="M 200,200 m -150,0 a 150,150 0 0,0 300,0" fill="none"/>
  </defs>
  
  <!-- Background circle (white) -->
  <circle cx="200" cy="200" r="195" fill="white" stroke="#1e3a5f" stroke-width="3"/>
  
  <!-- Outer decorative ring -->
  <circle cx="200" cy="200" r="185" fill="none" stroke="#1e3a5f" stroke-width="8"/>
  
  <!-- Inner ring -->
  <circle cx="200" cy="200" r="170" fill="none" stroke="#1e3a5f" stroke-width="2"/>
  
  <!-- Stars on left and right -->
  <text x="55" y="205" font-family="Arial" font-size="20" fill="#1e3a5f">★</text>
  <text x="335" y="205" font-family="Arial" font-size="20" fill="#1e3a5f">★</text>
  
  <!-- Top curved text: NIGERIAN PORTS AUTHORITY -->
  <text font-family="Arial Black, Arial" font-size="18" font-weight="bold" fill="#1e3a5f" letter-spacing="3">
    <textPath href="#topTextPath" startOffset="50%" text-anchor="middle">
      NIGERIAN PORTS AUTHORITY
    </textPath>
  </text>
  
  <!-- Bottom curved text: OFFICE OF THE MANAGING DIRECTOR -->
  <text font-family="Arial Black, Arial" font-size="13" font-weight="bold" fill="#1e3a5f" letter-spacing="2">
    <textPath href="#bottomTextPath" startOffset="50%" text-anchor="middle">
      OFFICE OF THE MANAGING DIRECTOR
    </textPath>
  </text>
  
  <!-- NPA Logo placeholder circle (center) -->
  <circle cx="200" cy="130" r="50" fill="#f0f4f8" stroke="#1e3a5f" stroke-width="1"/>
  
  <!-- NPA Logo text placeholder -->
  <text x="200" y="125" font-family="Arial" font-size="12" fill="#1e3a5f" text-anchor="middle">NPA</text>
  <text x="200" y="140" font-family="Arial" font-size="8" fill="#1e3a5f" text-anchor="middle">LOGO</text>
  
  <!-- Signature area -->
  <rect x="100" y="185" width="200" height="50" fill="none" stroke="#cccccc" stroke-width="1" stroke-dasharray="4,2" rx="5"/>
  <text x="200" y="215" font-family="Brush Script MT, cursive" font-size="24" fill="#333333" text-anchor="middle" font-style="italic">
    Signature
  </text>
  
  <!-- DIGITALLY APPROVED text -->
  <text x="200" y="255" font-family="Arial" font-size="14" font-weight="bold" fill="#1e3a5f" text-anchor="middle" letter-spacing="2">
    DIGITALLY APPROVED
  </text>
  
  <!-- Serial Number -->
  <text x="200" y="275" font-family="Consolas, monospace" font-size="12" fill="#1e3a5f" text-anchor="middle">
    NPA-MD-A24F9E9B13
  </text>
  
  <!-- Date/Time -->
  <text x="200" y="292" font-family="Arial" font-size="10" fill="#666666" text-anchor="middle">
    30 November 2024 • 15:45 WAT
  </text>
  
  <!-- QR Code placeholder -->
  <rect x="170" y="305" width="60" height="60" fill="#f5f5f5" stroke="#1e3a5f" stroke-width="1"/>
  <text x="200" y="340" font-family="Arial" font-size="8" fill="#999999" text-anchor="middle">QR CODE</text>
</svg>

