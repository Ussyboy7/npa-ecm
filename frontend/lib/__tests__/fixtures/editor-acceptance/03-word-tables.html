<!-- Simulated Microsoft Word paste (mso / o: namespaces + table) -->
<html xmlns:o="urn:schemas-microsoft-com:office:office"
      xmlns:w="urn:schemas-microsoft-com:office:word">
<body>
<!--[if gte mso 9]><xml><w:WordDocument></w:WordDocument></xml><![endif]-->
<p class="MsoNormal"><b>Word table paste fixture</b></p>
<table class="MsoTableGrid" border="1" cellspacing="0" cellpadding="0" style="border-collapse:collapse;border:1px solid #000000;">
  <tr>
    <td style="border:1px solid #000000;padding:4px;"><p class="MsoNormal"><b>Item</b></p></td>
    <td style="border:1px solid #000000;padding:4px;"><p class="MsoNormal"><b>Description</b></p></td>
    <td style="border:1px solid #000000;padding:4px;"><p class="MsoNormal"><b>Qty</b></p></td>
  </tr>
  <tr>
    <td style="border:1px solid #000000;padding:4px;"><p class="MsoNormal">A1</p></td>
    <td style="border:1px solid #000000;padding:4px;"><p class="MsoNormal">Jetty fender replacement</p></td>
    <td style="border:1px solid #000000;padding:4px;"><p class="MsoNormal">12</p></td>
  </tr>
  <tr>
    <td style="border:1px solid #000000;padding:4px;"><p class="MsoNormal">A2</p></td>
    <td style="border:1px solid #000000;padding:4px;"><p class="MsoNormal">Mooring rope inspection</p></td>
    <td style="border:1px solid #000000;padding:4px;"><p class="MsoNormal">4</p></td>
  </tr>
</table>
<p class="MsoNormal">End of Word paste.</p>
</body>
</html>
